      <input class="geb-encrypted__input" data-geb-password type="password" autocomplete="current-password" placeholder="访问密码" aria-label="GEB 访问密码">
      <button class="geb-encrypted__button" type="submit">解锁阅读</button>
    </form>
    <p class="geb-encrypted__status" data-geb-status aria-live="polite"></p>
  </div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-geb-encrypted]')
  if (!root || root.dataset.bound === 'true') return
  root.dataset.bound = 'true'

  var sessionPasswordKey = 'geb.unlock.password.v1'
  var form = root.querySelector('[data-geb-form]')
  var input = root.querySelector('[data-geb-password]')
  var status = root.querySelector('[data-geb-status]')

  var fromBase64 = function (value) {
    var binary = atob(value)
    var bytes = new Uint8Array(binary.length)
    for (var index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index)
    return bytes
  }

  var setStatus = function (message) {
    if (status) status.textContent = message || ''
  }

  var readSessionPassword = function () {
    try {
      return window.sessionStorage ? window.sessionStorage.getItem(sessionPasswordKey) || '' : ''
    } catch (error) {
      return ''
    }
  }

  var saveSessionPassword = function (password) {
    try {
      if (window.sessionStorage) window.sessionStorage.setItem(sessionPasswordKey, password)
    } catch (error) {}
  }

  var clearSessionPassword = function () {
    try {
      if (window.sessionStorage) window.sessionStorage.removeItem(sessionPasswordKey)
    } catch (error) {}
  }

  var decodePrivatePayload = function (plainBuffer) {
    var text = new TextDecoder().decode(plainBuffer)
    try {
      var decoded = JSON.parse(text)
      if (decoded && typeof decoded.html === 'string') return decoded
    } catch (error) {}
    return { html: text, title: '', date: '', updated: '' }
  }

  var restorePrivateHeader = function (privatePayload) {
    var title = privatePayload && privatePayload.title ? privatePayload.title : ''
    var date = privatePayload && privatePayload.date ? privatePayload.date : ''
    var updated = privatePayload && privatePayload.updated ? privatePayload.updated : ''

    if (title) {
      document.querySelectorAll('[data-geb-private-title]').forEach(function (node) {
        node.textContent = title
      })
      if (document.title.indexOf('GEB 私有文章') === 0) {
        document.title = document.title.replace(/^GEB 私有文章/, title)
      }
    }

    var metaText = ''
    if (date) metaText = '发布于 ' + date
    if (updated && updated !== date) metaText += (metaText ? ' · ' : '') + '更新于 ' + updated
    if (metaText) {
      document.querySelectorAll('[data-geb-private-meta]').forEach(function (node) {
        node.textContent = metaText
      })
    }
  }

  var installPrivateToolbar = function () {
    if (document.querySelector('[data-geb-private-toolbar]')) return
    var article = document.getElementById('article-container')
    if (!article || !article.parentNode) return

    var toolbar = document.createElement('div')
    toolbar.className = 'geb-private-toolbar'
    toolbar.setAttribute('data-geb-private-toolbar', '')

    var onPortal = /^\/geb\/?(?:index\.html)?$/.test(window.location.pathname)
    if (!onPortal) {
      var back = document.createElement('a')
      back.className = 'geb-private-toolbar__link'
      back.href = '/geb/'
      back.textContent = '← 返回 GEB 知识库'
      toolbar.appendChild(back)
    }

    var exit = document.createElement('button')
    exit.type = 'button'
    exit.className = 'geb-private-toolbar__exit'
    exit.textContent = '退出 GEB'
    exit.addEventListener('click', function () {
      clearSessionPassword()
      delete document.documentElement.dataset.gebUnlocked
      if (onPortal) window.location.reload()
      else window.location.replace('/geb/')
    })
    toolbar.appendChild(exit)

    article.parentNode.insertBefore(toolbar, article)
  }

  var decryptEnvelope = function (data, password) {
    var salt = fromBase64(data.salt)
    var iv = fromBase64(data.iv)
    var tag = fromBase64(data.tag)
    var payload = fromBase64(data.payload)
    var ciphertext = new Uint8Array(payload.length + tag.length)
    ciphertext.set(payload, 0)
    ciphertext.set(tag, payload.length)

    return window.crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (baseKey) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        )
      })
      .then(function (key) {
        return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext)
      })
  }

  var hydrateProtectedImages = function (password) {
    var images = document.querySelectorAll('img[data-geb-protected-src]')
    images.forEach(function (image) {
      var url = image.getAttribute('data-geb-protected-src')
      if (!url) return

      fetch(url, { credentials: 'same-origin' })
        .then(function (response) {
          if (!response.ok) throw new Error('Unable to load protected GEB image.')
          return response.json()
        })
        .then(function (data) {
          return decryptEnvelope(data, password).then(function (plainBuffer) {
            var blob = new Blob([plainBuffer], { type: data.mime || 'application/octet-stream' })
            image.src = URL.createObjectURL(blob)
            image.removeAttribute('data-geb-protected-src')
          })
        })
        .catch(function () {
          image.alt = (image.alt || 'GEB image') + '（图片解锁失败）'
        })
    })
  }

  var rebuildGebToc = function () {
    var article = document.getElementById('article-container')
    var card = document.getElementById('card-toc')
    if (!article || !card) return

    var tocContent = card.querySelector('.toc-content')
    if (!tocContent) return

    var headings = Array.prototype.slice.call(article.querySelectorAll('h1,h2,h3,h4,h5,h6'))
      .filter(function (heading) { return !!heading.id })

    tocContent.innerHTML = ''
    if (!headings.length) {
      card.style.display = 'none'
      return
    }

    var rootList = document.createElement('ol')
    rootList.className = 'toc'
    var firstLevel = parseInt(headings[0].tagName.slice(1), 10)
    var stack = [{ level: firstLevel, list: rootList }]

    headings.forEach(function (heading) {
      var level = parseInt(heading.tagName.slice(1), 10)

      while (stack.length > 1 && level < stack[stack.length - 1].level) stack.pop()

      if (level > stack[stack.length - 1].level) {
        var parentList = stack[stack.length - 1].list
        var parentItem = parentList.lastElementChild
        if (parentItem) {
          var childList = document.createElement('ol')
          childList.className = 'toc-child'
          parentItem.appendChild(childList)
          stack.push({ level: level, list: childList })
        }
      }

      var currentList = stack[stack.length - 1].list
      var item = document.createElement('li')
      item.className = 'toc-item toc-level-' + level

      var link = document.createElement('a')
      link.className = 'toc-link'
      link.setAttribute('href', '#' + heading.id)

      var text = document.createElement('span')
      text.className = 'toc-text'
      text.innerHTML = heading.innerHTML

      link.appendChild(text)
      item.appendChild(link)
      currentList.appendChild(item)
    })

    tocContent.appendChild(rootList)
    tocContent.style.display = 'block'
    card.style.display = ''
  }

  var unlockWithPassword = function (password, rememberSession, automatic) {
    if (!password) return Promise.reject(new Error('Missing password.'))

    setStatus(automatic ? '正在恢复本标签页的 GEB 解锁状态...' : '正在解锁...')

    return Promise.resolve()
      .then(function () {
        var data = JSON.parse(root.getAttribute('data-payload') || '{}')
        return decryptEnvelope(data, password)
      })
      .then(function (plainBuffer) {
        var privatePayload = decodePrivatePayload(plainBuffer)
        if (rememberSession) saveSessionPassword(password)
        root.outerHTML = privatePayload.html
        document.documentElement.dataset.gebUnlocked = 'true'
        restorePrivateHeader(privatePayload)
        installPrivateToolbar()
        hydrateProtectedImages(password)
        rebuildGebToc()

        // Follow Butterfly's native encrypted-post lifecycle. Butterfly listens
        // for this event and re-runs MathJax plus the other post processors
        // registered under globalFn.encrypt.
        if (window.globalFn && window.globalFn.encrypt) {
          // Butterfly 5.5.3 assumes translateFn exists in its decrypt-event
          // handler even when the translation feature is disabled. Supply a
          // temporary no-op so the remaining encrypt callbacks (MathJax, etc.)
          // can still run, then restore the original global state.
          var hadTranslateFn = !!window.translateFn
          var previousTranslateInit = hadTranslateFn ? window.translateFn.translateInitialization : undefined
          if (!hadTranslateFn) window.translateFn = {}
          if (typeof window.translateFn.translateInitialization !== 'function') {
            window.translateFn.translateInitialization = function () {}
          }

          window.dispatchEvent(new CustomEvent('hexo-blog-decrypt', { detail: { source: 'geb' } }))

          if (previousTranslateInit === undefined) delete window.translateFn.translateInitialization
          else window.translateFn.translateInitialization = previousTranslateInit
          if (!hadTranslateFn) delete window.translateFn
        } else if (window.MathJax && window.MathJax.typesetPromise) {
          // Fallback for a minimal/non-Butterfly layout.
          window.MathJax.typesetPromise()
        }
      })
      .catch(function (error) {
        if (automatic) {
          clearSessionPassword()
          setStatus('本标签页保存的 GEB 解锁状态已失效，请重新输入密码。')
        } else {
          setStatus('解锁失败，请检查密码。')
        }
        throw error
      })
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault()
    var password = input ? input.value : ''
    if (!password) {
      setStatus('请输入访问密码。')
      return
    }

    unlockWithPassword(password, true, false).catch(function () {})
  })

  window.addEventListener('pageshow', function (event) {
    if (event.persisted && document.documentElement.dataset.gebUnlocked === 'true' && !readSessionPassword()) {
      window.location.reload()
    }
  })

  var sessionPassword = readSessionPassword()
  if (sessionPassword) unlockWithPassword(sessionPassword, false, true).catch(function () {})
})()
